name: "Run lint and tests"

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 18.19.1
      - name: "Install dependencies"
        run: npm ci --legacy-peer-deps
      - name: "Run tests"
        run: npm run test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 18.19.1
      - name: "Install dependencies"
        run: npm ci --legacy-peer-deps
      - name: "Run lint"
        run: npm run lint